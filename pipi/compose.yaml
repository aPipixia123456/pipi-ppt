name: pipi-ppt
x-backend: &backend
  build:
    context: ..
    dockerfile: pipi/Dockerfile.backend
  image: pipi-ppt-backend:local
  restart: unless-stopped
  environment: &environment
    PIPI_DATABASE_URL: postgresql+psycopg://pipi:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres/pipi
    PIPI_REDIS_URL: redis://redis:6379/0
    PIPI_CREDENTIAL_KEY: ${PIPI_CREDENTIAL_KEY:?Set a Fernet key in your secret manager}
    PIPI_GATEWAY_URL: ${PIPI_GATEWAY_URL:?Set the pipiapi origin}
    PIPI_PUBLIC_URL: ${PIPI_PUBLIC_URL:?Set the PPT website origin}
  volumes: ["assets:/data"]
  tmpfs: ["/tmp:size=256m,mode=1777"]
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: pipi
      POSTGRES_USER: pipi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["database:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipi -d pipi"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: ["queue:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    <<: *backend
    mem_limit: 1g
    cpus: 1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
  worker:
    <<: *backend
    command: ["celery", "-A", "pipi.backend.worker:celery", "worker", "--loglevel=WARNING", "-Q", "generation", "--autoscale=32,2", "--max-tasks-per-child=20"]
    mem_limit: 4g
    cpus: 2
    depends_on:
      api: {condition: service_healthy}
  exporter:
    <<: *backend
    command: ["celery", "-A", "pipi.backend.worker:celery", "worker", "--loglevel=WARNING", "-Q", "export", "--autoscale=8,1", "--max-tasks-per-child=10"]
    mem_limit: 3g
    cpus: 2
    depends_on:
      api: {condition: service_healthy}
  scheduler:
    <<: *backend
    command: ["celery", "-A", "pipi.backend.worker:celery", "worker", "-B", "-s", "/data/celerybeat-schedule", "--loglevel=WARNING", "-Q", "celery", "--concurrency=1"]
    mem_limit: 512m
    cpus: 0.5
    depends_on:
      api: {condition: service_healthy}
  web:
    build:
      context: ..
      dockerfile: pipi/Dockerfile.web
    image: pipi-ppt-web:local
    restart: unless-stopped
    ports: ["127.0.0.1:${PIPI_PORT:-3100}:3000"]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    depends_on:
      api: {condition: service_healthy}

volumes:
  database:
  queue:
  assets:
